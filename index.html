<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survive the Island</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sunny, playful, a little toy-like — a game world, not a website
   IDEA: a tiny low-poly island where every follower owns a hut with their name on the sign
   PICTURE: the full-screen 3D island itself; UI floats on it like stickers
   COLOUR and TYPE: lagoon teal ground, sand cards, coral accent; Baloo 2 for names/titles, Nunito for text
   LAYOUT: island fills the screen; title chip top-left, search top-right, resident card bottom-left; Reel mode crops to 9:16 */
:root{--sea:#0d5566;--sand:#fbf1d8;--ink:#16292f;--coral:#ff6b4a;--muted:#5b6d70}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#06303a;color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06303a}
#wrap{position:relative;width:100%;height:100%;container-type:size;overflow:hidden}
#wrap canvas{display:block;width:100%;height:100%;touch-action:none}
body.reel #wrap{width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9))}
.hud{position:fixed;z-index:5;display:flex;gap:10px;align-items:center}
body.reel .hud,body.reel #card{display:none}
#top{top:14px;left:14px;right:14px;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:var(--sand);border-radius:16px;padding:8px 16px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.chip h1{margin:0;font:800 26px/1.05 'Baloo 2',sans-serif;letter-spacing:-.01em}
.chip p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.chip small{display:block;font-size:13px;color:var(--muted)}
form{display:flex;gap:8px;background:var(--sand);border-radius:16px;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
input{font:16px Nunito,sans-serif;border:2px solid #e2d3ad;background:#fff;border-radius:10px;padding:0 12px;height:44px;width:220px;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button{font:800 15px Nunito,sans-serif;height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--coral);color:#fff;cursor:pointer}
button.alt{background:var(--sea)}
#bottom{right:14px;bottom:14px}
#card{position:fixed;left:14px;bottom:14px;z-index:5;max-width:min(360px,calc(100vw - 28px));display:none}
#card.on{display:block}
#card h2{margin:0;font:800 28px/1.05 'Baloo 2',sans-serif;overflow-wrap:anywhere}
#card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#card .tags span{background:#fff;border:2px solid #e2d3ad;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700}
#card .x{position:absolute;top:6px;right:6px;height:36px;width:36px;padding:0;background:transparent;color:var(--muted);font-size:22px}
/* reel overlay — text sits inside the 9:16 frame, clear of the top and bottom fifths */
.ov{position:absolute;left:6%;right:6%;text-align:center;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.02;text-wrap:balance;
  text-shadow:0 .5cqw 0 rgba(0,0,0,.35),0 0 2cqw rgba(0,0,0,.35);-webkit-text-stroke:.35cqw #0b2e36;paint-order:stroke fill;opacity:0;transition:opacity .25s,transform .25s;transform:translateY(2cqw);pointer-events:none}
.ov.on{opacity:1;transform:none}
#hook{top:21%;font-size:9.5cqw}
#lab{top:63%;font-size:11cqw}
#lab small{display:block;font-size:6cqw;color:#ffe2a8;margin-top:1.5cqw}
#cta{top:62%;font-size:8.5cqw}
#cta small{display:block;font-size:5.5cqw;color:#ffe2a8;margin-top:2cqw}
#exit{position:fixed;right:10px;bottom:10px;z-index:9;display:none;opacity:.55;background:#000}
body.reel #exit{display:block}
@media(max-width:600px){
  #top{flex-direction:column;align-items:stretch}
  form{width:100%}input{flex:1;width:auto}
  .chip h1{font-size:22px}
}
@media(prefers-reduced-motion:reduce){.ov{transition:none}}
#pui{display:none}body.play #pui{display:block}body.play #bottom,body.play #smp{display:none}
#coco{position:fixed;z-index:6;top:96px;left:14px;font:800 18px 'Baloo 2',sans-serif}
#hint{position:fixed;z-index:6;bottom:14px;left:50%;transform:translateX(-50%);font-size:14px;white-space:nowrap}
#guide{position:fixed;z-index:6;top:96px;right:14px;font-weight:800;display:none}#guide.on{display:block}
#pexit{position:fixed;z-index:6;right:14px;bottom:14px}
#joy{position:fixed;z-index:6;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,250,240,.35);border:3px solid rgba(255,255,255,.7);display:none;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:var(--sand);box-shadow:0 4px 0 rgba(0,0,0,.2)}
body.touch #joy{display:block}body.touch #hint{display:none}
body.play #card{bottom:auto;top:150px}
@media(max-width:600px){#coco,#guide{top:150px}body.play #card{top:200px}}
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <div class="ov" id="hook"></div>
  <div class="ov" id="lab"></div>
  <div class="ov" id="cta"></div>
</div></div>

<div class="hud" id="top">
  <div class="chip"><h1 id="ttl">Survive the Island</h1><p id="sub">Loading the island…</p><small id="smp"></small></div>
  <form id="f" autocomplete="off">
    <input id="q" list="names" placeholder="Find your hut: @username" aria-label="Search your username">
    <datalist id="names"></datalist>
    <button>Find</button>
  </form>
</div>
<div class="hud" id="bottom"><button class="alt" id="tour" type="button">Fly around</button><button class="alt" id="reelBtn" type="button">Reel mode</button><button id="playBtn" type="button">Play</button></div>
<div id="pui"><div class="chip" id="coco">Coconuts 0/20</div><div class="chip" id="hint">Walk: WASD or arrows · Turn camera: Q / E or drag</div>
<div id="joy"><div id="knob"></div></div><button id="pexit" type="button">Exit</button><div class="chip" id="guide"></div></div>
<div class="chip" id="card"><button class="x" id="cx" type="button" aria-label="Close">×</button><div id="cardIn"></div></div>
<button id="exit" type="button">Exit reel (Esc)</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const M=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c,flatShading:true}));

const shape=a=>1+.06*Math.sin(3*a+.7)+.04*Math.sin(7*a+1.3)+.025*Math.sin(13*a);
function blob(r1,r2,h,seg){const g=new THREE.CylinderGeometry(r1,r2,h,seg,1);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),s=shape(Math.atan2(z,x));p.setX(i,x*s);p.setZ(i,z*s)}g.computeVertexNormals();return g}

function signTex(text,w=512,h=128,bg='#f6e7c1'){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,w,h);g.strokeStyle='#7a4f2a';g.lineWidth=10;g.strokeRect(5,5,w-10,h-10);
  let fs=h*.6;g.font=`800 ${fs}px "Baloo 2",sans-serif`;while(g.measureText(text).width>w*.88&&fs>12){fs-=2;g.font=`800 ${fs}px "Baloo 2",sans-serif`}
  g.fillStyle='#3b2412';g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+fs*.06);
  const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t}

  const lean=.12+Math.random()*.12;let px=0,py=0;

  const top=new THREE.Group();top.position.set(px,py+.05,0);g.add(top);
  for(let i=0;i<7;i++){const lg=new THREE.Group();lg.rotation.y=i*.9;top.add(lg);const geo=B(2.1,.06,.5);geo.translate(1.05,0,0);const l=mk(geo,i%2?'#3f9a4a':'#4fae57',0,0,0,lg);l.rotation.z=-.42}

    [-.06,.06].forEach(z=>mk(B(.03,.18,.03),'#ffb703',0,.09,z,g))},
  volcano(g){mk(new THREE.ConeGeometry(.95,1.2,7),'#5c4033',0,.6,0,g);mk(new THREE.CylinderGeometry(.22,.3,.12,7),new THREE.MeshBasicMaterial({color:'#ff5400'}),0,1.12,0,g);
    [[.15,1.5,.3],[-.1,1.85,.24],[.12,2.15,.18]].forEach(([x,y,r])=>mk(new THREE.SphereGeometry(r,6,5),'#b0b0b0',x,y,0,g));

    if(cols.every(c=>Math.hypot(c.x-x,c.z-z)>c.r+.8)&&nuts.every(o=>Math.hypot(o.position.x-x,o.position.z-z)>4)){const m=mk(nutG,'#7f5539',x,.6,z);m.visible=false;nuts.push(m);n++}}}
function ground(x,z){const a=Math.atan2(z,x),r=Math.hypot(x,z);return r>IR*shape(a)?-.25:0}
let actx=null;function blip(f=880){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(f,actx.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.6,actx.currentTime+.12);
  g.gain.setValueAtTime(.18,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.26)}catch(e){}}
function startPlay(){if(!player)setupPlay();PLAY.on=true;document.body.classList.add('play');touring=false;ctl.autoRotate=false;$('tour').textContent='Fly around';
  if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
  player.visible=true;nuts.forEach(n=>n.visible=!n.userData.got);player.position.set(0,0,4.5);fly=null;ctl.enabled=false;marker.visible=false;$('card').classList.remove('on');
  PLAY.last=performance.now();blip(660);updCoco()}
function stopPlay(){PLAY.on=false;document.body.classList.remove('play');player.visible=false;nuts.forEach(n=>n.visible=false);ctl.enabled=true;$('guide').classList.remove('on');
  $('card').classList.remove('on');const w=wide();flyTo(w.p,w.t,1.4)}
const updCoco=()=>$('coco').textContent=`Coconuts ${PLAY.got}/${nuts.length}`+(PLAY.got===nuts.length&&nuts.length?' · island legend!':'');
$('playBtn').onclick=startPlay;$('pexit').onclick=stopPlay;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;PLAY.keys[e.key.toLowerCase()]=1;if(PLAY.on&&e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{PLAY.keys[e.key.toLowerCase()]=0});
{const joy=$('joy'),knob=$('knob');let id=null;
 const mv=e=>{const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const L=Math.hypot(x,y),M=50;if(L>M){x*=M/L;y*=M/L}
   PLAY.joy={x:x/M,y:y/M};knob.style.transform=`translate(${x}px,${y}px)`};
 joy.addEventListener('pointerdown',e=>{id=e.pointerId;joy.setPointerCapture(id);mv(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});
 const end=()=>{id=null;PLAY.joy={x:0,y:0};knob.style.transform=''};joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
 let dx=null;const cv=renderer.domElement;cv.addEventListener('pointerdown',e=>{if(PLAY.on)dx=e.clientX});cv.addEventListener('pointermove',e=>{if(PLAY.on&&dx!=null){PLAY.yaw-=(e.clientX-dx)*.008;dx=e.clientX}});
 addEventListener('pointerup',()=>dx=null)}
function playStep(t){const now=performance.now(),dt=Math.min(.05,(now-PLAY.last)/1000);PLAY.last=now;const K=PLAY.keys;
  let ix=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0)+PLAY.joy.x,iz=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0)+PLAY.joy.y;
  if(K.q)PLAY.yaw+=dt*1.8;if(K.e)PLAY.yaw-=dt*1.8;
  const L=Math.hypot(ix,iz);if(L>1){ix/=L;iz/=L}
  const sy=Math.sin(PLAY.yaw),cy=Math.cos(PLAY.yaw);const wx=ix*cy+iz*sy,wz=-ix*sy+iz*cy;const sp=6.5*(K.shift?1.6:1);
  let x=player.position.x+wx*sp*dt,z=player.position.z+wz*sp*dt;
  for(const c of cols){const dx=x-c.x,dz=z-c.z,d=Math.hypot(dx,dz),m=c.r+.4;if(d<m&&d>0){x=c.x+dx/d*m;z=c.z+dz/d*m}}
  const a=Math.atan2(z,x),lim=(IR+3.8)*shape(a);if(Math.hypot(x,z)>lim){x=Math.cos(a)*lim;z=Math.sin(a)*lim}
  player.position.set(x,ground(x,z),z);const P=player.userData,moving=Math.hypot(wx,wz)>.05;
  if(moving)player.rotation.y=Math.atan2(wx,wz);const sw=moving?Math.sin(t*11)*.7:0;P.l1.rotation.x=sw;P.l2.rotation.x=-sw;P.a1.rotation.x=-sw;P.a2.rotation.x=sw;
  // camera follows behind
  const cp=new V(x+Math.sin(PLAY.yaw)*11,player.position.y+7.5,z+Math.cos(PLAY.yaw)*11);cam.position.lerp(cp,1-Math.pow(.001,dt));ctl.target.set(x,1.2,z);cam.lookAt(ctl.target);
  // coconuts
  nuts.forEach(n=>{if(n.userData.got)return;n.position.y=.6+Math.sin(t*3+n.position.x)*.15;n.rotation.y=t*2;
    if(Math.hypot(n.position.x-x,n.position.z-z)<1.3){n.userData.got=1;n.visible=false;PLAY.got++;updCoco();blip(PLAY.got===nuts.length?1320:880)}});
  // nearby hut
  let best=null,bd=4.6;for(const h of huts){const d=Math.hypot(h.x-x,h.z-z);if(d<bd){bd=d;best=h}}
  if(best!==PLAY.near){PLAY.near=best;if(best){const p=best.p;$('cardIn').innerHTML=`<h2>@${esc(p.u)}</h2><p>${p.u===CFG.handle.slice(1)?'The castaway who started it all':'Moved in on day '+p.day}${p.near?` · neighbour of @${esc(p.near)}`:''}</p>`+((p.x||[]).length?`<div class="tags">${p.x.map(e=>`<span>${esc(e)}</span>`).join('')}</div>`:'');$('card').classList.add('on');blip(520);if(PLAY.goal===best){PLAY.goal=null;$('guide').classList.remove('on');P.arrow.visible=false}}else $('card').classList.remove('on')}
  // guide to searched hut
  if(PLAY.goal){const g=PLAY.goal,d=Math.hypot(g.x-x,g.z-z);P.arrow.visible=true;P.arrow.rotation.set(Math.PI/2,0,0);
    const ang=Math.atan2(g.x-x,g.z-z)-player.rotation.y;P.arrow.position.set(Math.sin(ang)*1.2,2.6,Math.cos(ang)*1.2);P.arrow.rotation.z=-ang;P.arrow.lookAt(new V(g.x,2.6,g.z));P.arrow.rotateX(Math.PI/2);
    $('guide').textContent=`@${g.p.u}: ${Math.round(d)} m`;$('guide').classList.add('on')}
}
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(wrap);

const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime(),now=performance.now();
  const pa=wg.attributes.position;for(let i=0;i<pa.count;i++){const x=wb[i*3],z=wb[i*3+2];pa.setY(i,Math.sin(x*.09+t*1.1)*.16+Math.cos(z*.08+t*.9)*.16)}
  pa.needsUpdate=true;wg.computeVertexNormals();
  if(marker.visible&&marker.userData.h){const h=marker.userData.h;const tall=(h.p.x||[]).includes('tower');marker.position.set(h.x,(tall?6.4:5)+Math.sin(t*4)*.3,h.z);marker.rotation.y=t*2}
  if(fly){const k=Math.min(1,(now-fly.s)/fly.d),e=ease(k);cam.position.lerpVectors(fly.p0,fly.p1,e);ctl.target.lerpVectors(fly.t0,fly.t1,e);
    if(k===1){const r=fly.res;fly=null;ctl.enabled=true;r()}}
  if(PLAY.on)playStep(t);else ctl.update();
  {const cx=cam.position.x,cz=cam.position.z,tx=ctl.target.x,tz=ctl.target.z,dx=tx-cx,dz=tz-cz,L=dx*dx+dz*dz||1,near=Math.sqrt(L)<60;
   for(const g of PALMS){const u=((g.position.x-cx)*dx+(g.position.z-cz)*dz)/L;
     const hide=near&&u>-.05&&u<.93&&Math.hypot(cx+dx*u-g.position.x,cz+dz*u-g.position.z)<2.8||near&&Math.hypot(g.position.x-cx,g.position.z-cz)<5;g.visible=!hide}}
  renderer.render(scene,cam)}

const start=()=>{build();const w=wide(1.25);cam.position.copy(w.p);ctl.target.copy(w.t);resize();loop()};
let started=false;const go=()=>{if(!started){started=true;try{start()}catch(err){$('sub').textContent='Could not start 3D: '+err.message}}};
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('800 40px "Baloo 2"'),document.fonts.ready]):Promise.resolve()).then(go,go);setTimeout(go,2500);
}
