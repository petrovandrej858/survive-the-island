<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survive the Island</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sunny, playful, a little toy-like — a game world, not a website
   IDEA: a tiny low-poly island where every follower owns a hut with their name on the sign
   PICTURE: the full-screen 3D island itself; UI floats on it like stickers
   COLOUR and TYPE: lagoon teal ground, sand cards, coral accent; Baloo 2 for names/titles, Nunito for text
   LAYOUT: island fills the screen; title chip top-left, search top-right, resident card bottom-left; Reel mode crops to 9:16 */
:root{--sea:#0d5566;--sand:#fbf1d8;--ink:#16292f;--coral:#ff6b4a;--muted:#5b6d70}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#06303a;color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06303a}
#wrap{position:relative;width:100%;height:100%;container-type:size;overflow:hidden}
#wrap canvas{display:block;width:100%;height:100%;touch-action:none}
body.reel #wrap{width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9))}
.hud{position:fixed;z-index:5;display:flex;gap:10px;align-items:center}
body.reel .hud,body.reel #card{display:none}
#top{top:14px;left:14px;right:14px;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:var(--sand);border-radius:16px;padding:8px 16px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.chip h1{margin:0;font:800 26px/1.05 'Baloo 2',sans-serif;letter-spacing:-.01em}
.chip p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.chip small{display:block;font-size:13px;color:var(--muted)}
form{display:flex;gap:8px;background:var(--sand);border-radius:16px;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
input{font:16px Nunito,sans-serif;border:2px solid #e2d3ad;background:#fff;border-radius:10px;padding:0 12px;height:44px;width:220px;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
button{font:800 15px Nunito,sans-serif;height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--coral);color:#fff;cursor:pointer}
button.alt{background:var(--sea)}
#bottom{right:14px;bottom:14px}
#card{position:fixed;left:14px;bottom:14px;z-index:5;max-width:min(360px,calc(100vw - 28px));display:none}
#card.on{display:block}
#card h2{margin:0;font:800 28px/1.05 'Baloo 2',sans-serif;overflow-wrap:anywhere}
#card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#card .tags span{background:#fff;border:2px solid #e2d3ad;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700}
#card .x{position:absolute;top:6px;right:6px;height:36px;width:36px;padding:0;background:transparent;color:var(--muted);font-size:22px}
/* reel overlay — text sits inside the 9:16 frame, clear of the top and bottom fifths */
.ov{position:absolute;left:6%;right:6%;text-align:center;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;line-height:1.02;text-wrap:balance;
  text-shadow:0 .5cqw 0 rgba(0,0,0,.35),0 0 2cqw rgba(0,0,0,.35);-webkit-text-stroke:.35cqw #0b2e36;paint-order:stroke fill;opacity:0;transition:opacity .25s,transform .25s;transform:translateY(2cqw);pointer-events:none}
.ov.on{opacity:1;transform:none}
#hook{top:21%;font-size:9.5cqw}
#lab{top:63%;font-size:11cqw}
#lab small{display:block;font-size:6cqw;color:#ffe2a8;margin-top:1.5cqw}
#cta{top:62%;font-size:8.5cqw}
#cta small{display:block;font-size:6.2cqw;color:#ffe2a8;margin-top:2cqw}
#exit{position:fixed;right:10px;bottom:10px;z-index:9;display:none;opacity:.55;background:#000}
body.reel #exit{display:block}
@media(max-width:600px){
  #top{flex-direction:column;align-items:stretch}
  form{width:100%}input{flex:1;width:auto}
  .chip h1{font-size:22px}
}
@media(prefers-reduced-motion:reduce){.ov{transition:none}}
#pui{display:none}body.play #pui{display:block}body.play #bottom,body.play #smp{display:none}
#coco{position:fixed;z-index:6;top:96px;left:14px;font:800 18px 'Baloo 2',sans-serif}
#hint{position:fixed;z-index:6;bottom:14px;left:50%;transform:translateX(-50%);font-size:14px;white-space:nowrap}
#guide{position:fixed;z-index:6;top:96px;right:14px;font-weight:800;display:none}#guide.on{display:block}
#pexit{position:fixed;z-index:6;right:14px;bottom:14px}
#act{position:fixed;z-index:7;right:22px;bottom:84px;width:104px;height:104px;border-radius:50%;font:800 17px 'Baloo 2',sans-serif;line-height:1;box-shadow:0 6px 0 #b8432a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:pulse 1.2s infinite}#act span{font-size:34px}#act.lk{background:#6c757d;box-shadow:0 6px 0 #3d4349;animation:none}#mute{position:fixed;z-index:6;right:14px;top:96px;width:48px;padding:0;font-size:22px;background:var(--sand)}#guide{top:150px!important}#act.on{display:flex}@keyframes pulse{50%{transform:scale(1.07)}}
#joy{position:fixed;z-index:6;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,250,240,.35);border:3px solid rgba(255,255,255,.7);display:none;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:var(--sand);box-shadow:0 4px 0 rgba(0,0,0,.2)}
body.touch #joy{display:block}body.touch #hint{display:none}
body.play #card{bottom:auto;top:196px}
@media(max-width:600px){#mute{top:196px!important}#coco,#guide{top:150px}body.play #card{top:250px}}
</style>
</head>
<body>
<div id="stage"><div id="wrap">
  <div class="ov" id="hook"></div>
  <div class="ov" id="lab"></div>
  <div class="ov" id="cta"></div>
</div></div>

<div class="hud" id="top">
  <div class="chip"><h1 id="ttl">Survive the Island</h1><p id="sub">Loading the island…</p><small id="smp"></small></div>

    <input id="q" list="names" placeholder="Find your hut: @username" aria-label="Search your username">
    <datalist id="names"></datalist>
    <button>Find</button>
  </form>
</div>
<div class="hud" id="bottom"><button class="alt" id="tour" type="button">Fly around</button><button class="alt" id="reelBtn" type="button">Reel mode</button><button id="playBtn" type="button">Walk</button><button id="gameBtn" type="button">Join the game</button></div>
<div id="pui"><div class="chip" id="coco">Coconuts 0/20</div><div class="chip" id="hint">Walk: WASD or arrows · Turn camera: Q / E or drag</div>
<div id="joy"><div id="knob"></div></div><button id="pexit" type="button">Exit</button><button id="act" type="button"></button><button id="mute" type="button" aria-label="Sound on or off">🔊</button><div class="chip" id="guide"></div></div>
<div class="chip" id="card"><button class="x" id="cx" type="button" aria-label="Close">×</button><div id="cardIn"></div></div>
<button id="exit" type="button">Exit reel (Esc)</button>

  if(t)for(let i=0;i<16&&!pos;i++){const a=Math.atan2(t.z,t.x)+(i%2?1:-1)*Math.ceil(i/2)*.42,rr=Math.hypot(t.x,t.z);

  while(!pos){k++;const rr=4.5+3.05*Math.sqrt(k),a=k*GA,x=Math.cos(a)*rr,z=Math.sin(a)*rr;if(free(x,z,2.4))pos=[x,z]}
  occ.push({x:pos[0],z:pos[1],r:2.4});{const d=Math.hypot(pos[0],pos[1])||1;occ.push({x:pos[0]+pos[0]/d*3.2,z:pos[1]+pos[1]/d*3.2,r:1.2,yard:1})}const h={p,x:pos[0],z:pos[1]};byName[p.u.toLowerCase()]=h;huts.push(h)});

  {const d=Math.hypot(x-(PLAY.lx??x),z-(PLAY.lz??z));PLAY.walk=(PLAY.walk||0)+d;PLAY.lx=x;PLAY.lz=z;if(PLAY.walk>1.7){PLAY.walk=0;SFX.play('step')}}

/* ===== SOUND: synthesized with Web Audio, no files ===== */
const SFX=(()=>{let ctx,master,amb=null,muted=false,nb;try{muted=localStorage.getItem('sti_mute')==='1'}catch(e){}
  const C=()=>{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=muted?0:.8;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx};
  const noise=()=>{if(nb)return nb;const c=C();nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return nb};
  function burst({dur=.15,type='lowpass',f=800,f2,q=1,vol=.5,delay=0}){const c=C(),t=c.currentTime+delay,s=c.createBufferSource();s.buffer=noise();const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);
    if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl).connect(g).connect(master);s.start(t,Math.random());s.stop(t+dur+.05)}
  function tone({f=440,f2,dur=.2,type='sine',vol=.3,delay=0}){const c=C(),t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.05)}
  const S={
    chop(){burst({dur:.12,f:1300,vol:.6});tone({f:150,f2:60,dur:.16,vol:.5})},
    mine(){tone({f:2200,f2:1700,dur:.25,type:'triangle',vol:.25});tone({f:3300,dur:.1,type:'square',vol:.05});burst({dur:.08,type:'highpass',f:3000,vol:.3})},
    dig(){burst({dur:.25,type:'bandpass',f:500,f2:250,q:.8,vol:.7})},
    cast(){burst({dur:.35,type:'bandpass',f:2500,f2:600,q:2,vol:.4})},
    splash(){burst({dur:.45,f:1800,f2:300,vol:.55});burst({dur:.2,type:'highpass',f:2500,vol:.2,delay:.05})},
    step(){burst({dur:.05,type:'bandpass',f:900,q:1.5,vol:.1})},
    reward(){[523,659,784,1047].forEach((f,i)=>tone({f,dur:.18,type:'triangle',vol:.22,delay:i*.08}))},
    big(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone({f,dur:.3,type:'square',vol:.08,delay:i*.09}));S.reward()},
    fail(){tone({f:240,f2:150,dur:.35,type:'sawtooth',vol:.1})},
    lock(){tone({f:180,dur:.12,type:'square',vol:.09});tone({f:140,dur:.15,type:'square',vol:.09,delay:.14})},
    rumble(){burst({dur:.9,f:220,f2:50,vol:.6})},
    near(){tone({f:880,f2:1320,dur:.12,type:'triangle',vol:.12})}};
  function startAmb(){const c=C();if(amb)return;const s=c.createBufferSource();s.buffer=noise();s.loop=true;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=450;
    const g=c.createGain();g.gain.value=.1;const l=c.createOscillator();l.frequency.value=.13;const lg=c.createGain();lg.gain.value=.07;l.connect(lg).connect(g.gain);s.connect(fl).connect(g).connect(master);s.start();l.start();
    const bird=setInterval(()=>{if(Math.random()<.55){const b=2200+Math.random()*1600,n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)tone({f:b,f2:b*1.35,dur:.07,vol:.045,delay:i*.11})}},2300);amb={s,l,bird}}
  function stopAmb(){if(!amb)return;try{amb.s.stop();amb.l.stop()}catch(e){}clearInterval(amb.bird);amb=null}
  return{play(n){if(muted)return;try{S[n]&&S[n]()}catch(e){}},startAmb(){try{startAmb()}catch(e){}},stopAmb,
    toggle(){muted=!muted;try{localStorage.setItem('sti_mute',muted?'1':'0')}catch(e){}if(master)master.gain.value=muted?0:.8;return muted},get muted(){return muted}}})();

  g.userData.smoke=smoke;const[sx,sz]=placeOut(a,-.6);return{g,sx,sz,cx,cz}}
